<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PetCare - Propietario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Logo pequeño fijo -->
    <div id="header-peque" class="header-peque">
        <img src="img/logo.jpeg" alt="Logo PetCare">
        <p>"Cuidamos con amor cada patita"</p>
    </div>

    <!-- Opciones login / registro -->
    <div id="opciones-login" class="text-center mt-5">
        <button id="btn-registrarse" class="btn btn-petcare w-50 mt-3">Registrarse</button>
        <button id="btn-iniciar-sesion" class="btn btn-petcare w-50 mt-3">Iniciar Sesión</button>
    </div>

    <!-- Contenedor dinámico para formularios -->
    <div id="contenido-propietario" class="mt-4 container"></div>

    <script src="js/propietario.js"></script>
</body>
</html>
